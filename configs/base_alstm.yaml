# 基线：ALSTM / 5 天窗口 / 5 维价格 / 关 Label Smoothing
# 用法：python run.py --config configs/base_alstm.yaml
# 说明：命令行同名参数优先，例如 python run.py --config configs/base_alstm.yaml --seed 101
dataset: CSMD50
model: alstm
use_news: false
useGPU: false
use_swanlab: false
epochs: 300
look_back_window: 5
batch_size: 64
layers: 2
hidden_size: 128
attention_size: 128
dropout: 0.1
lr: 0.0003
weight_decay: 0.0001
input_size: 5
feature_columns: "Open,High,Low,Close,Adj Close"
label_smoothing: false
label_smoothing_epsilon: 0.1
seed: 37
model_save_folder: "./result/CSMD50_w5_base/model_saved/"
figure_save_folder: "./result/CSMD50_w5_base/figure/"
test_result_save_folder: "./result/CSMD50_w5_base/test_result/"
